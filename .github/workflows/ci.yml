name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # Built before the managed build, because Directory.Build.targets copies
      # whatever is in build/native into every project's output — which is how a
      # developer machine ends up testing the native encoder and, until now, how
      # CI silently did not. The row it unlocks covers the sub-4x4 mip levels
      # CMP_Core rejects, which is a case that has already gone wrong once.
      - name: Check out Compressonator (CMP_Core)
        uses: actions/checkout@v4
        with:
          repository: GPUOpen-Tools/compressonator
          ref: master
          path: external/compressonator
          sparse-checkout: |
            cmp_core
            applications/_libs/cmp_math
          sparse-checkout-cone-mode: false

      - name: Build native encoder shim
        run: |
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release \
            -DCOMPRESSONATOR_SOURCE="$GITHUB_WORKSPACE/external/compressonator"
          cmake --build build/native --config Release

      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - run: dotnet test --no-build -c Release --verbosity normal

  publish:
    name: Publish ${{ matrix.rid }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  rid: linux-x64, archive: tar }
          - { os: windows-latest, rid: win-x64,   archive: zip }
          # Both macOS targets build on the Apple Silicon runner: GitHub is
          # retiring the Intel macos-13 image and jobs queued on it can hang
          # indefinitely. AOT cross-compiles arm64 -> x64 fine, since both use
          # the same clang and macOS SDK.
          - { os: macos-latest,   rid: osx-x64,   archive: tar }
          - { os: macos-latest,   rid: osx-arm64, archive: tar }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # Native AOT on Linux links with clang against zlib.
      - name: Install AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      # The fast encoder is a ~500 KB shared library built from Compressonator's
      # CMP_Core. Linux and Windows only: macOS would mean a third native payload
      # for a platform this tool is rarely used on, and the managed encoder covers
      # it. Only two directories of that repo are needed.
      - name: Check out Compressonator (CMP_Core)
        if: runner.os != 'macOS'
        uses: actions/checkout@v4
        with:
          repository: GPUOpen-Tools/compressonator
          ref: master
          path: external/compressonator
          sparse-checkout: |
            cmp_core
            applications/_libs/cmp_math
          sparse-checkout-cone-mode: false

      - name: Build native encoder shim
        if: runner.os != 'macOS'
        shell: bash
        run: |
          ls external/compressonator/cmp_core/source/cmp_core.cpp
          cmake -S native -B build/native -DCMAKE_BUILD_TYPE=Release -DCOMPRESSONATOR_SOURCE="$GITHUB_WORKSPACE/external/compressonator"
          cmake --build build/native --config Release

      - name: Derive version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "value=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # The CLI is fully Native AOT: one ~2 MB binary, no runtime to install,
      # about 1 ms of startup.
      - name: Publish CLI (Native AOT)
        run: >
          dotnet publish src/Stingray.Cli -c Release -r ${{ matrix.rid }}
          -p:Version=${{ steps.version.outputs.value }} -o out/cli

      # The GUI is Native AOT too. Its XAML uses compiled bindings throughout, so
      # the only trim warnings left came from Avalonia.Controls.DataGrid; the
      # csproj suppresses those two roll-ups and records what each one covers.
      # Skia and HarfBuzz stay as shared libraries beside the binary, since
      # SkiaSharp ships no static archive to link against.
      - name: Publish GUI (Native AOT)
        run: >
          dotnet publish src/Stingray.Gui -c Release -r ${{ matrix.rid }}
          -p:Version=${{ steps.version.outputs.value }} -o out/gui

      # A clean link does not prove a trimmed binary boots: Avalonia resolves its
      # windowing backend, theme and Skia at run time, and a trimming mistake
      # shows up there rather than at compile time. Render the window offscreen
      # and require a non-empty PNG back.
      - name: Smoke-test the AOT GUI
        if: matrix.rid == 'linux-x64'
        run: |
          set -euo pipefail
          sudo apt-get install -y xvfb libx11-6 libice6 libsm6 libfontconfig1
          xvfb-run -a ./out/gui/stingray-tex-gui --screenshot /tmp/smoke.png
          test -s /tmp/smoke.png
          echo "rendered $(stat -c%s /tmp/smoke.png) bytes"

          # Again in Chinese. The localised strings are reached only through
          # x:Static from XAML, so a trimming change could drop them without any
          # warning; rendering the window in both languages is what would notice.
          STINGRAY_LANG=zh xvfb-run -a ./out/gui/stingray-tex-gui --screenshot /tmp/smoke-zh.png
          test -s /tmp/smoke-zh.png
          echo "rendered $(stat -c%s /tmp/smoke-zh.png) bytes in Chinese"

      - name: Stage release layout
        shell: bash
        run: |
          set -euo pipefail
          stage="stingray-tex-${{ steps.version.outputs.value }}-${{ matrix.rid }}"
          mkdir -p "$stage"
          # Everything the publish produced except debug symbols. That includes
          # the Skia and HarfBuzz shared libraries, which the AOT binary loads
          # from its own directory and cannot run without.
          find out/cli out/gui -maxdepth 1 -type f \
            ! -name '*.pdb' ! -name '*.dbg' ! -name '*.dwarf' \
            -exec cp {} "$stage/" \;
          cp LICENSE README.md README.zh-CN.md CHANGELOG.md "$stage/"

          # The publish already carries the shim when it was built, but copy it
          # explicitly so a missed copy cannot silently drop the fast encoder,
          # and so its MIT notice always ships alongside.
          shim=$(find build/native \( -name 'stingray_cmp.so' -o -name 'stingray_cmp.dll' \) 2>/dev/null | head -1 || true)
          if [ -n "$shim" ]; then
            cp "$shim" "$stage/"
            cp native/COMPRESSONATOR-LICENSE.txt "$stage/"
            echo "bundled fast encoder: $shim"
          else
            echo "no native shim for this platform; managed encoder only"
          fi
          echo "STAGE=$stage" >> "$GITHUB_ENV"
          ls -la "$stage"

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar'
        run: tar -czf "$STAGE.tar.gz" "$STAGE"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path $env:STAGE -DestinationPath "$env:STAGE.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: stingray-tex-${{ matrix.rid }}
          path: |
            ${{ env.STAGE }}.tar.gz
            ${{ env.STAGE }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - run: ls -la artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body: |
            Native AOT builds of both the command-line tool and the GUI.

            Neither needs a .NET runtime installed. Unpack the archive for your
            platform and run — everything else it needs is in there: the Skia
            and HarfBuzz rendering libraries, and `stingray_cmp`, the fast
            encoder, on Linux and Windows. Keep the files together.
